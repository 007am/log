<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cozy Winter Workout Console</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Cold night outside, warm hearth inside. */
:root {
  --night-top: #0f1620;
  --night-bottom: #1a1311;
  --moon: rgba(150, 196, 232, 0.22);
  --hearth: rgba(224, 122, 72, 0.30);
  --frost-line: rgba(190, 224, 246, 0.18);
  --ember: #e07a48;
  --ember-light: #f5a878;
  --snow: #eaf6ff;
  --text-heading: #f8ead8;
  --text-title: #f1d6b0;
  --text-secondary: #bfb0a2;
  --text-muted: #8f8579;
  --done-bg: linear-gradient(100deg, rgba(58, 38, 28, 0.92), rgba(44, 30, 24, 0.92));
  --done-border: rgba(140, 74, 39, 0.60);
  --done-glow: #d86c35;
  --done-text: #8f7a6c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

body {
  min-height: 100vh;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-x: hidden;
  color: var(--text-heading);
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--night-bottom);
}
/* Static sky: painted once, never repainted while scrolling. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -8%, var(--moon), transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 108%, var(--hearth), transparent 70%),
    linear-gradient(var(--night-top), var(--night-bottom));
}

/* ---------- Falling snow (two drifting layers) ---------- */
.snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.snow { overflow: hidden; }
/* Each layer is taller than the screen and slid down by exactly one tile with transform only. */
.snow::before, .snow::after { content: ''; position: absolute; left: 0; right: 0; top: -340px; bottom: 0; background-repeat: repeat; will-change: transform; }
.snow::before {
  background-size: 220px 220px;
  background-image:
    radial-gradient(2px 2px at 24px 40px, rgba(255,255,255,.85), transparent),
    radial-gradient(1.5px 1.5px at 110px 150px, rgba(255,255,255,.65), transparent),
    radial-gradient(2.5px 2.5px at 180px 80px, rgba(255,255,255,.9), transparent),
    radial-gradient(1.5px 1.5px at 70px 200px, rgba(255,255,255,.6), transparent);
  animation: snowfall-a 18s linear infinite;
}
.snow::after {
  background-size: 340px 340px;
  background-image:
    radial-gradient(3px 3px at 60px 90px, rgba(255,255,255,.55), transparent),
    radial-gradient(2px 2px at 220px 250px, rgba(255,255,255,.5), transparent),
    radial-gradient(3.5px 3.5px at 290px 30px, rgba(255,255,255,.6), transparent);
  animation: snowfall-b 32s linear infinite;
}
@keyframes snowfall-a { to { transform: translate3d(0, 220px, 0); } }
@keyframes snowfall-b { to { transform: translate3d(0, 340px, 0); } }

/* ---------- Shell ---------- */
.console-wrapper { position: relative; z-index: 1; width: 100%; max-width: 480px; margin: auto 0; }
.console-wrapper::before {
  content: '';
  position: absolute;
  inset: -16px;
  background: radial-gradient(ellipse at 50% 100%, rgba(224, 122, 72, 0.24), transparent 70%);
  pointer-events: none;
}
.console {
  position: relative;
  --px: 26px;
  --pb: 28px;
  padding: 34px var(--px) var(--pb);
  overflow: hidden;
  border-radius: 26px;
  border: 1px solid var(--frost-line);
  background: linear-gradient(180deg, rgba(36, 34, 38, 0.95), rgba(38, 27, 22, 0.97));
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 60px rgba(224, 122, 72, 0.08), inset 0 1px 0 rgba(220, 240, 255, 0.16);
}

.view { display: none; }
.view.is-active { display: block; animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Header ---------- */
header { position: relative; text-align: center; padding-bottom: 24px; margin-bottom: 26px; }
header::after {
  content: '';
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--frost-line) 20%, rgba(245, 168, 120, 0.35) 50%, var(--frost-line) 80%, transparent);
}
.winter-mark {
  margin-bottom: 10px;
  font-size: 22px;
  line-height: 1;
  color: var(--snow);
  text-shadow: 0 0 10px rgba(180, 220, 250, 0.7), 0 6px 18px rgba(224, 122, 72, 0.45);
  animation: twinkle 4s ease-in-out infinite;
}
.winter-mark::before { content: '❄'; }
@keyframes twinkle { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
.heading { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; color: var(--text-title); }

/* ---------- Home ---------- */
#home-view .heading { font-size: clamp(24px, 7vw, 30px); letter-spacing: 2px; line-height: 1; text-shadow: 0 2px 14px rgba(224, 122, 72, 0.25); }

.day-list { display: flex; flex-direction: column; gap: 13px; }
.day-btn {
  position: relative;
  overflow: hidden;
  width: 100%;
  min-height: clamp(78px, 22vw, 100px);
  padding: 18px 20px 18px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
  cursor: pointer;
  border-radius: 18px;
  border: 1px solid var(--frost-line);
  background: linear-gradient(110deg, rgba(62, 44, 34, 0.86), rgba(40, 32, 30, 0.82));
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 235, 215, 0.06);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, box-shadow 0.25s;
}
.day-btn::before {
  content: '';
  position: absolute;
  left: 0;
  top: 16px;
  bottom: 16px;
  width: 3px;
  border-radius: 0 4px 4px 0;
  background: linear-gradient(var(--ember-light), var(--ember));
  box-shadow: 0 0 12px rgba(224, 122, 72, 0.6);
  transition: top 0.25s, bottom 0.25s;
}
.day-btn::after {
  content: '';
  position: absolute;
  right: -50px;
  top: -50px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(190, 224, 246, 0.10), transparent 70%);
  pointer-events: none;
}
.day-btn:hover { transform: translateY(-2px); border-color: rgba(245, 168, 120, 0.5); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 24px rgba(224, 122, 72, 0.14); }
.day-btn:hover::before { top: 11px; bottom: 11px; }
.day-btn:active { transform: translateY(1px); }
.day-title { position: relative; z-index: 1; font-size: clamp(30px, 9vw, 38px); line-height: 1; }
.day-arrow {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(245, 168, 120, 0.35);
  background: rgba(224, 122, 72, 0.10);
  color: var(--ember-light);
  transition: transform 0.25s, background 0.25s;
}
.day-btn:hover .day-arrow { transform: translateX(3px); background: rgba(224, 122, 72, 0.2); }

/* ---------- Workout ---------- */
#workout-view header { margin-bottom: 22px; }
#workout-view .heading {
  display: flex;
  flex-direction: column;
  align-items: center;
  white-space: nowrap;
  font-size: clamp(28px, 8.5vw, 38px);
  line-height: 1.05;
  text-shadow: 0 2px 14px rgba(224, 122, 72, 0.25);
}
#workout-view .heading span:first-child { font-size: 0.42em; letter-spacing: 4px; font-style: normal; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }

.tracker {
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding: 14px 18px 17px;
  border-radius: 14px;
  border: 1px solid var(--frost-line);
  background: rgba(20, 20, 24, 0.45);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
}
.tracker::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  width: 100%;
  transform: scaleX(var(--p, 0));
  transform-origin: left;
  background: linear-gradient(90deg, #9fd3f0, var(--ember-light), var(--ember));
  box-shadow: 0 0 10px rgba(224, 122, 72, 0.6);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.tracker-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); }
.tracker-count { padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ember-light); background: rgba(245, 168, 120, 0.12); }

.tile-list { display: flex; flex-direction: column; gap: 10px; }

/* Colours come from PALETTES in the script. Frost = single ring, ember = double ring. */
.tile {
  position: relative;
  overflow: hidden;
  width: 100%;
  padding: 14px 16px 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
  text-align: left;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg);
  box-shadow: var(--shadow);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
}
.tile::before {
  content: '';
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 0 4px 4px 0;
  background: var(--rail);
  box-shadow: 0 0 10px var(--rail);
  transition: background 0.25s, box-shadow 0.25s;
}
.tile:hover { transform: translateX(3px); border-color: var(--hover-border); }
.tile-check {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid var(--check);
  background: rgba(0, 0, 0, 0.3);
  box-shadow: var(--ring);
  transition: all 0.25s ease;
}
.tile-text { display: flex; flex-direction: column; min-width: 0; flex-grow: 1; }
.tile-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.3; color: var(--title); transition: color 0.2s; }
.tile-meta { margin-top: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: var(--meta); transition: color 0.2s; }

.tile.done { background: var(--done-bg); border-color: var(--done-border); box-shadow: inset 0 0 14px rgba(216, 108, 53, 0.10); }
.tile.done::before { background: var(--done-glow); box-shadow: 0 0 10px var(--done-glow); }
.tile.done .tile-title { text-decoration: line-through; color: var(--done-text); }
.tile.done .tile-meta { color: #6f5d51; }
.tile.done .tile-check { background: var(--done-glow); border-color: var(--done-glow); box-shadow: 0 0 14px rgba(216, 108, 53, 0.55); }
.tile.done .tile-check::after { content: '✓'; color: #fff0df; font-size: 12px; font-weight: bold; }

.actions { margin-top: 24px; min-height: 60px; }
.finish-btn {
  display: none;
  width: 100%;
  padding: 17px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--ember), #c45e2a);
  color: #fff0df;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  cursor: pointer;
  box-shadow: 0 6px 22px rgba(224, 122, 72, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
}
.finish-btn.is-visible { display: block; }
.finish-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(224, 122, 72, 0.55); filter: brightness(1.08); }
.finish-btn:active { transform: translateY(1px); }
.back-link { display: block; margin-top: 15px; padding: 4px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); cursor: pointer; transition: color 0.2s; }
.back-link:hover { color: var(--snow); text-decoration: underline; }

.day-btn:focus-visible, .tile:focus-visible, .finish-btn:focus-visible { outline: 2px solid #9fd3f0; outline-offset: 3px; }

/* ---------- Hearth: glow grows as you complete exercises (--heat is 0..1, set by the script) ---------- */
.hearth {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 60vh;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse 75% 100% at 50% 112%, rgba(255, 150, 80, 0.55), rgba(224, 122, 72, 0.2) 45%, transparent 72%);
  opacity: calc(0.3 + var(--heat, 0) * 0.7);
  will-change: opacity;
  transition: opacity 1.2s ease;
}

/* ---------- Home scenery: pines and a lit cabin ---------- */
#home-view { position: relative; padding-bottom: min(110px, 24vw); }
.scenery { position: absolute; left: calc(-1 * var(--px)); right: calc(-1 * var(--px)); bottom: calc(-1 * var(--pb)); line-height: 0; pointer-events: none; }
.scenery svg { display: block; width: 100%; height: auto; }
.scenery .trees { fill: #0a0f15; }
.scenery .ground { fill: rgba(190, 224, 246, 0.13); }
.scenery .cabin-body { fill: #120c09; }
.scenery .cabin-roof { fill: #0c0806; stroke: rgba(220, 238, 250, 0.55); stroke-width: 2; stroke-linejoin: round; }
.scenery .window { fill: #f5a878; }

/* ---------- Thaw: a warm wash spreads from the check circle when an exercise is ticked ---------- */
.tile.thaw::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 31px 50%, rgba(255, 214, 170, 0.65), rgba(224, 122, 72, 0.28) 35%, transparent 70%);
  transform-origin: 31px 50%;
  will-change: transform, opacity;
  animation: thaw 0.9s ease-out forwards;
}
@keyframes thaw { from { opacity: 1; transform: scale(0.1); } to { opacity: 0; transform: scale(2.6); } }

/* ---------- Finish: rising embers + a pulsing button ---------- */
.embers { position: fixed; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; z-index: 5; }
.ember-spark {
  position: absolute;
  bottom: 0;
  left: var(--x);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle, #ffe2bd, #f5a878 40%, rgba(224, 122, 72, 0) 100%);
  will-change: transform, opacity;
  opacity: 0;
  animation: spark 2.6s ease-out var(--d) forwards;
}
@keyframes spark { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -75vh) scale(0.3); } }
.finish-btn { position: relative; }
.finish-btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 8px 34px rgba(224, 122, 72, 0.75); opacity: 0; pointer-events: none; will-change: opacity; }
.finish-btn.is-visible { animation: rise 0.35s ease; }
.finish-btn.is-visible::after { animation: glowPulse 2.6s ease-in-out 0.5s infinite; }
@keyframes glowPulse { 50% { opacity: 1; } }

/* ---------- Responsive ---------- */
@media (max-width: 600px) {
  body { padding: max(10px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); min-height: 100dvh; }
  .console-wrapper { max-width: none; margin: 0; }
  .console { --px: 13px; --pb: 18px; padding-top: 24px; border-radius: 20px; }
  header { padding-bottom: 16px; margin-bottom: 18px; }
  .winter-mark { font-size: 18px; margin-bottom: 7px; }
  .day-list { gap: 9px; }
  .day-btn { padding: 14px 12px 14px 20px; border-radius: 15px; }
  .day-arrow { width: 30px; height: 30px; }
  .tracker { padding: 10px 12px 14px; margin-bottom: 14px; }
  .tracker-label { font-size: 9px; letter-spacing: 1px; }
  .tracker-count { font-size: 11px; padding: 4px 8px; }
  .tile-list { gap: 7px; }
  .tile { min-height: 54px; padding: 10px 11px 10px 16px; gap: 10px; border-radius: 12px; }
  .tile-check { width: 20px; height: 20px; }
  .tile-title { font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
  .tile-meta { font-size: 9.5px; margin-top: 2px; }
  .finish-btn { min-height: 50px; padding: 14px 10px; font-size: 10px; letter-spacing: 1.2px; border-radius: 12px; }
  .back-link { font-size: 9px; }
}
@media (max-width: 600px) and (orientation: landscape) {
  .console { --px: 16px; --pb: 16px; max-width: 700px; margin: 0 auto; padding-top: 16px; }
  .tile { min-height: 48px; padding-top: 8px; padding-bottom: 8px; }
}
@media (max-height: 480px) { .scenery { display: none; } #home-view { padding-bottom: 0; } }
@media (hover: none) { .day-btn:hover, .tile:hover, .finish-btn:hover, .day-btn:hover .day-arrow { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .snow::before, .snow::after, .winter-mark, .finish-btn::after { animation: none; }
  .embers, .tile.thaw::after { display: none; }
}

/* ---------- Logbook and mobile-first controls ---------- */
.home-tools { display:grid; gap:9px; margin-top:18px; position:relative; z-index:2; }
.tool-btn { width:100%; min-height:48px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(245,168,120,.38); border-radius:13px; background:linear-gradient(110deg,rgba(78,50,35,.82),rgba(52,37,29,.88)); color:var(--text-title); font-size:11px; font-weight:700; letter-spacing:1px; cursor:pointer; text-decoration:none; }
.tool-btn.secondary { background:rgba(120,175,210,.10); border-color:var(--frost-line); color:var(--snow); }
.file-label { position:relative; }
.exercise-card { display:flex; flex-direction:column; gap:7px; }
.tile { flex-shrink:0; }
.log-toggle { align-self:flex-end; border:1px solid var(--frost-line); background:rgba(120,175,210,.10); color:var(--snow); border-radius:9px; padding:7px 11px; min-height:34px; font-size:10px; font-weight:700; letter-spacing:.7px; cursor:pointer; }
.log-panel { display:none; padding:13px; border:1px solid var(--frost-line); border-radius:13px; background:rgba(12,17,23,.58); }
.log-panel.open { display:block; }
.log-panel-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; color:var(--text-title); font-size:12px; font-weight:700; }
.previous-performance { color:var(--text-muted); font-size:10px; font-weight:500; text-align:right; }
.set-row { display:grid; grid-template-columns:34px repeat(var(--n,3),minmax(0,1fr)); gap:7px; align-items:end; margin:9px 0; }
.set-number { color:var(--text-secondary); font-size:11px; padding-bottom:12px; font-weight:700; }
.log-field { min-width:0; display:flex; flex-direction:column; gap:5px; }
.log-field label { color:var(--text-secondary); font-size:9px; font-weight:700; letter-spacing:.5px; }
.log-field input { width:100%; min-width:0; height:43px; border:1px solid rgba(190,224,246,.22); border-radius:9px; background:rgba(255,255,255,.07); color:var(--snow); padding:0 8px; font:600 16px 'Plus Jakarta Sans',sans-serif; outline:none; }
.log-field input:focus { border-color:var(--ember-light); box-shadow:0 0 0 2px rgba(245,168,120,.13); }
.log-field input::placeholder { color:#766f69; }
.log-note { color:var(--text-muted); font-size:10px; margin-top:8px; }
.cardio-fields { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.logbook-controls { margin-bottom:16px; }
.logbook-controls label { display:block; color:var(--text-secondary); font-size:10px; font-weight:700; letter-spacing:1px; margin-bottom:7px; }
#exercise-select { width:100%; min-height:46px; border-radius:11px; border:1px solid var(--frost-line); background:#20232a; color:var(--snow); padding:0 12px; font:600 14px 'Plus Jakarta Sans',sans-serif; }
.logbook-subtitle { color:var(--text-muted); font-size:10px; margin-top:7px; }
.graph-section { margin:16px 0 22px; padding:13px 10px; border:1px solid var(--frost-line); border-radius:13px; background:rgba(10,16,23,.42); }
.graph-title { color:var(--text-title); font:italic 600 20px 'Cormorant Garamond',serif; margin:0 0 3px 3px; }
.graph-caption { color:var(--text-muted); font-size:9px; margin:0 0 8px 3px; }
.graph-wrap { width:100%; overflow:hidden; }
.graph-wrap svg { display:block; width:100%; height:auto; }
.graph-legend { display:flex; flex-wrap:wrap; gap:9px; margin:7px 3px 0; color:var(--text-secondary); font-size:9px; }
.legend-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
.logbook-empty { padding:20px 12px; text-align:center; color:var(--text-secondary); font-size:12px; border:1px dashed var(--frost-line); border-radius:12px; }
#logbook-view .heading { font-size:clamp(25px,7vw,34px); }
@media (max-width:600px) {
 body { padding:max(8px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left)); }
 .console-wrapper { max-width:none; width:100%; }
 .console { --px:12px; --pb:16px; width:100%; padding:20px var(--px) var(--pb); border-radius:17px; }
 .tile { min-height:58px; padding:11px 12px 11px 16px; gap:10px; }
 .tile-title { font-size:13px; }
 .tile-meta { font-size:10px; }
 .log-panel { padding:10px; }
 .set-row { grid-template-columns:25px repeat(var(--n,3),minmax(0,1fr)); gap:5px; }
 .log-field input { height:44px; font-size:16px; padding:0 5px; }
 .log-field label { font-size:8px; letter-spacing:0; }
 .tool-btn { min-height:48px; }
 .graph-section { padding:10px 7px; margin:12px 0 17px; }
 .graph-title { font-size:19px; }
}
@media (max-width:360px) { .set-row { grid-template-columns:22px repeat(var(--n,3),minmax(0,1fr)); gap:4px; } .log-field input { padding:0 3px; } }

/* Phones: one snow layer instead of two; everything else is already GPU-friendly. */
@media (max-width: 800px) {
  .snow::after { display: none; }
}
.graph-section { content-visibility: auto; contain-intrinsic-size: auto 250px; }

/* Backup reminder shown after finishing a workout */
.reminder { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30; margin: 0 auto; width: calc(100% - 24px); max-width: 456px; padding: 16px; border-radius: 18px; border: 1px solid rgba(245,168,120,.45); background: rgba(38,28,24,.98); box-shadow: 0 14px 40px rgba(0,0,0,.55), 0 0 30px rgba(224,122,72,.18); animation: rise .35s ease; }
.reminder[hidden] { display: none; }
.reminder-title { font-size: 14px; font-weight: 700; color: var(--text-title); }
.reminder-text { margin-top: 5px; font-size: 12px; line-height: 1.5; color: var(--text-secondary); }
.reminder-actions { margin-top: 13px; display: flex; align-items: center; gap: 10px; }
.reminder-save { flex: 1; min-height: 46px; border: none; border-radius: 12px; cursor: pointer; background: linear-gradient(135deg, var(--ember), #c45e2a); color: #fff0df; font: 700 12px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1.4px; text-transform: uppercase; box-shadow: 0 6px 18px rgba(224,122,72,.35); }
.reminder-later { padding: 12px 8px; border: none; background: none; cursor: pointer; color: var(--text-muted); font: 700 11px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>

<script>
/* =====================================================================
   CONFIG — everything you'd normally edit lives in this block.

const SESSION_NAME = "WINTER SESSION";

/* Tile palettes. Add one here, then use its name as `color` on any exercise.
   Colour is independent of sets.
   bg/border/shadow – tile surface      rail – glowing left edge
   hoverBorder      – border on hover    title/meta – text colours
   check            – check-circle border
   ring             – extra glow/ring on the check circle (a double ring = 2 sets, single = 1) */

   without one it records weight, reps and partials.

const FIELD_DEFS = {

    { cat: "Shoulders",         name: "Plate-Loaded Shoulder Press", id: "plate-loaded-shoulder-press",            sets: 2, color: "ember" },
    { cat: "Back",              name: "Plate-Loaded Seated Row", id: "plate-loaded-seated-row",                sets: 2, color: "ember" },
    { cat: "Chest",             name: "Pec Deck", id: "pec-deck",                               sets: 2, color: "ember" },
    { cat: "Quads",             name: "Leg Extension", id: "leg-extension",                          sets: 1, color: "frost" },
    { cat: "Triceps",           name: "Single-Arm Cable Pressdown", id: "single-arm-cable-pressdown",             sets: 2, color: "ember" },
    { cat: "Biceps",            name: "Bayesian Curl", id: "bayesian-curl",                          sets: 2, color: "ember" },
    { cat: "Traps",             name: "Plate-Loaded Kelso Shrug", id: "plate-loaded-kelso-shrug",               sets: 2, color: "ember" },
    { cat: "Core",              name: "Pallof Press", id: "pallof-press",                           sets: 2, color: "ember" },
    { cat: "Glutes",            name: "Standing Glute Drive", id: "standing-glute-drive",                   sets: 2, color: "ember" },
    { cat: "Tibialis",          name: "Tibialis Raises", id: "tibialis-raises",                        sets: 2, color: "ember" },
    { cat: "Grip",              name: "Farmer's Walk", id: "farmer-s-walk",                          sets: 2, fields: ["weight", "seconds"], color: "ember" },
    { cat: "Heart",             name: "Cardio", id: "cardio",                                 color: "ember" }
  ]}
};

/* Persistent workout logbook. Workout completion and training data are stored separately. */
const ACTIVE_DAY_KEY = "brutal_active_day_session";
const ACTIVE_SESSION_KEY = "winter_active_log_session_v1";
const progressKey = day => `brutal_workout_${day}`;
const DB_NAME = "winter_session_logbook";
const DB_VERSION = 1;
const STORE = "sessions";
const $ = id => document.getElementById(id);
let currentDay = null;
let done = new Set();
let currentSession = null;
let db = null;
let sessionsCache = [];

function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.warn("Local save failed", e); } }
function drop(key) { try { localStorage.removeItem(key); } catch {} }
function slug(s) { return String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function exId(ex) { return ex.id || slug(ex.name); }
function isCardio(ex) { return exId(ex) === 'cardio' || ex.name.toLowerCase() === 'cardio'; }
/* Old ids that must be treated as the same exercise. Old key -> current id.
   Existing saved sessions, drafts and backups are converted automatically. */
const ID_ALIASES = { "rdl": "smith-machine-romanian-deadlift" };
const canonId = id => ID_ALIASES[id] || id;
function programExercise(id) { for (const d of Object.values(PROGRAM)) for (const ex of d.exercises) if (exId(ex) === id) return ex; return null; }
// Moves records stored under an old id onto the current id. Returns true if anything changed.
function normalizeSession(sess) {
  if (!sess || !sess.exercises) return false;
  let changed = false;
  for (const [oldId, newId] of Object.entries(ID_ALIASES)) {
    const rec = sess.exercises[oldId];
    if (!rec) continue;
    const cur = sess.exercises[newId];
    const hasData = r => r && ((r.sets || []).some(setHasData));
    if (!cur || (!hasData(cur) && hasData(rec))) sess.exercises[newId] = rec;
    delete sess.exercises[oldId];
    const target = sess.exercises[newId], ex = programExercise(newId);
    target.exerciseId = newId;
    if (ex) { target.exerciseName = ex.name; target.category = ex.cat; }
    changed = true;
  }
  return changed;
}
const ACTIVE_SESSIONS_KEY = "winter_active_sessions_v1";   // { dayId: sessionId } so each day keeps its own unfinished session
const ACTIVE_DRAFT_PREFIX = "winter_active_draft_v1_";
const filled = v => v !== '' && v != null;
function esc(str) { return String(str).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function localDate(d=new Date()) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function tOf(s) { const t = Date.parse(s && s.startedAt); if (Number.isFinite(t)) return t; const d = Date.parse(((s && s.date) || '') + 'T12:00:00'); return Number.isFinite(d) ? d : 0; }
function fmtTime(sec) { sec=Math.max(0,Math.round(Number(sec)||0)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function fmtTick(v,unit) { return unit==='time' ? fmtTime(v) : Number(v.toFixed(1)); }
// Cardio time is stored in seconds (timeSeconds). Older saves stored minutes in `time`; they are converted here.
function cardioSeconds(c) {
  if(!c) return '';
  if(filled(c.timeSeconds) && Number.isFinite(Number(c.timeSeconds))) return Number(c.timeSeconds);
  if(filled(c.time) && Number.isFinite(Number(c.time))) return Math.round(Number(c.time)*60);
  return '';
}
const fieldsOf = ex => (ex.fields || []).filter(f => FIELD_DEFS[f]).length ? ex.fields.filter(f => FIELD_DEFS[f]) : DEFAULT_FIELDS;
const setHasData = x => !!x && Object.keys(FIELD_DEFS).some(f => filled(x[f]));
function fmtSet(x, fields=DEFAULT_FIELDS) {
  const w = filled(x.weight) ? x.weight : '—';
  if(fields.includes('seconds')) return `${w}×${filled(x.seconds) ? x.seconds + 's' : '—'}`;
  return `${w}×${filled(x.reps) ? x.reps : '—'}${Number(x.partials) ? `+${x.partials}` : ''}`;
}
const getActive = day => (load(ACTIVE_SESSIONS_KEY)||{})[day] || null;
function setActive(day,id) { const m=load(ACTIVE_SESSIONS_KEY)||{}; m[day]=id; save(ACTIVE_SESSIONS_KEY,m); }
function clearActive(day) { const m=load(ACTIVE_SESSIONS_KEY)||{}; delete m[day]; save(ACTIVE_SESSIONS_KEY,m); }
function showView(id) { document.querySelectorAll('.view').forEach(v => v.classList.toggle('is-active',v.id===id)); window.scrollTo({top:0,behavior:'instant'}); }
function openDB() {
 return new Promise((resolve,reject)=>{
  if (!('indexedDB' in window)) { reject(new Error('IndexedDB is unavailable in this browser.')); return; }
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{ const d=req.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'sessionId'}); };
  req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
 });
}
// Write using the key path of the database that is actually present. Older copies
// of this logbook may have created the store with a different inline key name.
function recordForStore(record, store) {
 const copy = structuredClone(record);
 if(!copy.sessionId) copy.sessionId = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
 const kp = store.keyPath;
 if(typeof kp === 'string') {
  const parts = kp.split('.');
  let target = copy;
  for(let i=0;i<parts.length-1;i++) target = target[parts[i]] ||= {};
  if(target[parts[parts.length-1]] == null) target[parts[parts.length-1]] = copy.sessionId;
  return {record:copy, key:undefined};
 }
 if(kp === null) return {record:copy, key:copy.sessionId};
 throw new Error('This workout database uses an unsupported compound key. Export your backup before changing the database.');
}
function dbPut(record) { return new Promise((resolve,reject)=>{ try { const tx=db.transaction(STORE,'readwrite'); const store=tx.objectStore(STORE); const item=recordForStore(record,store); if(item.key===undefined) store.put(item.record); else store.put(item.record,item.key); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error); } catch(e) { reject(e); } }); }
function dbGet(id) { return new Promise((resolve,reject)=>{ const req=db.transaction(STORE,'readonly').objectStore(STORE).get(id); req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error); }); }
function dbAll() { return new Promise((resolve,reject)=>{ const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll(); req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error); }); }
function dbPutMany(records) { return new Promise((resolve,reject)=>{ try { const tx=db.transaction(STORE,'readwrite'); const store=tx.objectStore(STORE); records.forEach(r=>{const item=recordForStore(r,store); if(item.key===undefined) store.put(item.record); else store.put(item.record,item.key);}); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error); } catch(e) { reject(e); } }); }
function makeSession(dayKey) {
 const now=new Date();
 return {schemaVersion:1,sessionId:'s_'+now.getTime().toString(36)+'_'+Math.random().toString(36).slice(2,8),dayId:dayKey,dayTitle:PROGRAM[dayKey].title,date:localDate(now),startedAt:now.toISOString(),completedAt:null,status:'in-progress',exercises:{}};
}
function draftKey(sessionId) { return ACTIVE_DRAFT_PREFIX + sessionId; }
function saveActiveDraft() {
 if(!currentSession) return;
 currentSession.updatedAt = new Date().toISOString();
 save(draftKey(currentSession.sessionId), currentSession);
}
function loadActiveDraft(sessionId) {

 if(old){try{const o=await dbGet(old);if(o&&o.status!=='completed'&&o.dayId&&!getActive(o.dayId))setActive(o.dayId,old);}catch{}drop(ACTIVE_SESSION_KEY);}
 const resumeDay=load(ACTIVE_DAY_KEY);
 if(resumeDay&&PROGRAM[resumeDay]){let sess=null;const id=getActive(resumeDay);if(id){try{sess=await dbGet(id);}catch{}}if(sess?.status==='completed')sess=null;startWorkout(resumeDay,sess);}
}
// Save what you typed even if the app is switched away or killed right after typing.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&currentSession)flushPersistCurrent().catch(()=>{});});
window.addEventListener('pagehide',()=>{if(currentSession)flushPersistCurrent().catch(()=>{});});
init();

</script>
